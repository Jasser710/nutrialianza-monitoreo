log_format combined_ext '$remote_addr - $remote_user [$time_local] '
                        '"$request" $status $body_bytes_sent '
                        '"$http_referer" "$http_user_agent" '
                        'rt=$request_time';

server {
    listen 80;
    server_name nutrialianza.local;

    access_log /var/log/nginx/nutrialianza_access.log combined_ext;
    error_log  /var/log/nginx/nutrialianza_error.log warn;

    location / {
        root /usr/share/nginx/html;
        index index.html;
    }

    # Endpoint de salud para el monitoreo HTTP
    location /health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }

    # Endpoint que genera latencia, para pruebas de saturación
    location /slow {
        return 200 "slow endpoint\n";
        add_header Content-Type text/plain;
    }
}
