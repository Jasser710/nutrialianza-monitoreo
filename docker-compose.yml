# ============================================================
#  NutriAlianza S.A. — Stack de monitoreo inteligente
#  Sintaxis compatible con Docker Compose v2 y superiores
# ============================================================

services:

  # ---------- Capa de servicios monitoreados ----------
  nginx:
    image: nginx:1.27-alpine
    container_name: na-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/conf.d/index.html:/usr/share/nginx/html/index.html:ro
      - nginx_logs:/var/log/nginx
    networks:
      - na-net

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.3.0
    container_name: na-nginx-exporter
    restart: unless-stopped
    command:
      - --nginx.scrape-uri=http://nginx:80/health
    depends_on:
      - nginx
    networks:
      - na-net

  mysql:
    image: mysql:8.0
    container_name: na-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
      - ./mysql/conf/custom.cnf:/etc/mysql/conf.d/custom.cnf:ro
      - mysql_data:/var/lib/mysql
      - mysql_logs:/var/log/mysql
    networks:
      - na-net

  # ---------- Capa de metricas ----------
  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: na-node-exporter
    restart: unless-stopped
    pid: host
    command:
      - --path.rootfs=/host
      - --collector.systemd
    volumes:
      - /:/host:ro,rslave
    networks:
      - na-net

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: na-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - na-net

  # ---------- Capa de logs ----------
  loki:
    image: grafana/loki:2.9.8
    container_name: na-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    networks:
      - na-net

  logstash:
    image: grafana/logstash-output-loki:main
    container_name: na-logstash
    restart: unless-stopped
    environment:
      LS_JAVA_OPTS: "-Xms256m -Xmx256m"
      XPACK_MONITORING_ENABLED: "false"
    volumes:
      - ./logstash/pipeline:/usr/share/logstash/pipeline:ro
    depends_on:
      - loki
    networks:
      - na-net

  filebeat:
    image: docker.elastic.co/beats/filebeat:8.15.0
    container_name: na-filebeat
    restart: unless-stopped
    user: root
    command: filebeat -e --strict.perms=false
    volumes:
      - ./filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - nginx_logs:/var/log/nginx:ro
      - mysql_logs:/var/log/mysql:ro
      - /var/log/auth.log:/var/log/host/auth.log:ro
      - filebeat_data:/usr/share/filebeat/data
    depends_on:
      - logstash
    networks:
      - na-net

  # ---------- Capa de automatizacion e IA ----------
  n8n:
    image: n8nio/n8n:latest
    container_name: na-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: ${N8N_USER}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_PASSWORD}
      GENERIC_TIMEZONE: America/Costa_Rica
      TZ: America/Costa_Rica
      N8N_SECURE_COOKIE: "false"
      N8N_RUNNERS_ENABLED: "true"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n:/backup
    networks:
      - na-net

  # ---------- Capa de visualizacion (Nivel Avanzado) ----------
  grafana:
    image: grafana/grafana:11.2.0
    container_name: na-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
    networks:
      - na-net

networks:
  na-net:
    driver: bridge

volumes:
  nginx_logs:
  mysql_data:
  mysql_logs:
  prometheus_data:
  loki_data:
  filebeat_data:
  n8n_data:
  grafana_data:
