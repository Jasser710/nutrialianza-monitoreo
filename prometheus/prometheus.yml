global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    empresa: nutrialianza
    entorno: produccion

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: node
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          servidor: nutrialianza-srv01

  - job_name: nginx
    metrics_path: /metrics
    static_configs:
      - targets: ['nginx-exporter:9113']
